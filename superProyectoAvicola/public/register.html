<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avícola San Martín - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <img src="img/logo.png" alt="Logo" width="60" height="60" class="rounded-circle border border-warning mb-2">
            <h3 class="fw-bold text-dark">Crear Cuenta</h3>
            <p class="text-muted small">Únete a Avícola San Martín</p>
        </div>

        <!-- Formulario con ID para capturarlo desde el JS -->
        <form id="formRegister">
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required placeholder="tu@correo.com">
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold text-dark">Registrarse</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">¿Ya tienes una cuenta? <a href="login.html" class="text-decoration-none fw-bold">Inicia sesión</a></small>
        </div>
        <div class="text-center mt-2">
            <a href="index.html" class="text-muted small text-decoration-none">← Volver al inicio</a>
        </div>
    </div>

    <!-- JS exclusivo de registro -->
    <script src="js/register.js"></script>
</body>
</html>
