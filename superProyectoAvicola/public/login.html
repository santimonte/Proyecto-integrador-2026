<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avícola San Martín - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <img src="img/logo.png" alt="Logo" width="60" height="60" class="rounded-circle border border-warning mb-2">
            <h3 class="fw-bold text-dark">Iniciar Sesión</h3>
            <p class="text-muted small">Avícola San Martín</p>
        </div>

        <form id="formLogin">
            <div class="mb-3">
                <label for="emailLogin" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="emailLogin" required placeholder="tu@correo.com">
            </div>
            <div class="mb-3">
                <label for="passwordLogin" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="passwordLogin" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-dark w-100 fw-bold">Entrar</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">¿No tienes cuenta? <a href="register.html" class="text-decoration-none fw-bold text-warning">Regístrate aquí</a></small>
        </div>
        <div class="text-center mt-2">
            <a href="index.html" class="text-muted small text-decoration-none">← Volver al inicio</a>
        </div>
    </div>

    <!-- JS exclusivo de login -->
    <script src="js/login.js"></script>
</body>
</html>
